services:
  pantau:
    build: ./app
    image: pantau:latest
    container_name: pantau
    restart: unless-stopped
    # The service reads keys from .env. Copy .env.example to .env. Do not commit .env.
    env_file: .env
    volumes:
      - ./data:/data          # The SQLite database is stored here. Delete the directory to reset.
    ports:
      - "8000:8000"           # The site is at http://localhost:8000. Remove this port if a reverse proxy fronts the service.
    # If a residential SOCKS proxy runs on the host for TikTok and markets (see README),
    # expose it to the container as `hostrelay`:
    # extra_hosts:
    #   - "hostrelay:host-gateway"

    # Optional Traefik reverse proxy. Uncomment these lines and set DOMAIN in .env
    # networks: [traefik-public]
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.pantau.rule=Host(`${DOMAIN}`)"
    #   - "traefik.http.routers.pantau.entrypoints=websecure"
    #   - "traefik.http.routers.pantau.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.pantau.loadbalancer.server.port=8000"

  # MCP server for AI agents. It runs from the same image with a different command.
  # It serves the monitor's data (situation brief, live streams, timeline, reachability,
  # markets, cities) over the Model Context Protocol (streamable HTTP) at /mcp.
  pantau-mcp:
    image: pantau:latest
    container_name: pantau-mcp
    restart: unless-stopped
    depends_on:
      - pantau
    command: ["python", "mcp_server.py"]
    environment:
      - PANTAU_API=http://pantau:8000
    ports:
      - "8001:8000"           # The MCP endpoint is http://localhost:8001/mcp
    # Behind a reverse proxy, route /mcp to this service (see README) instead of publishing a port.

# networks:
#   traefik-public:
